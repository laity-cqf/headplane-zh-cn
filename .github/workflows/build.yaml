name: Build
on:
  push:
    branches:
      - "main"
      - "stable"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check upstream sync automation
        run: node --test .github/scripts/*.test.cjs

      - name: Build
        run: ./build.sh --skip-pnpm-prune

      - name: Run unit tests
        run: pnpm run test:unit

  # Starts alongside the build, since the tests build what they need. Files
  # that call testedVersions() run once per Headscale version, the rest once.
  integration:
    name: Integration (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with HEADSCALE_VERSIONS in tests/harness/versions.ts.
        include:
          - { name: "Headscale 0.27.1", versions: "0.27.1", files: "-l" }
          - { name: "Headscale 0.28.0", versions: "0.28.0", files: "-l" }
          - { name: "Headscale 0.29.7", versions: "0.29.7", files: "-l" }
          - { name: "version independent", versions: "", files: "-L" }
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: pnpm run test:integration $(grep -r ${{ matrix.files }} testedVersions tests/integration --include='*.test.ts')
        env:
          HP_HEADSCALE_VERSIONS: ${{ matrix.versions }}

  nix:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check flake inputs
        uses: DeterminateSystems/flake-checker-action@main

      - name: Check flake outputs
        run: nix flake check

  smoke:
    name: Runtime (final, ${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read release identity
        id: identity
        run: |
          node .github/scripts/fork-release.cjs info > "$RUNNER_TEMP/identity.json"
          echo "version=$(jq -r .version "$RUNNER_TEMP/identity.json")" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r .image_tag "$RUNNER_TEMP/identity.json")" >> "$GITHUB_OUTPUT"
          echo "image=$(jq -r .image "$RUNNER_TEMP/identity.json")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and load image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          target: final
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: headplane-smoke:final
          cache-from: type=gha,scope=container-final-${{ matrix.arch }}
          cache-to: type=gha,scope=container-final-${{ matrix.arch }},mode=max
          build-args: |
            IMAGE_TAG=${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.tag }}
            HEADPLANE_VERSION=${{ steps.identity.outputs.version }}
      - name: Check runtime with every supported real Headscale version
        env:
          SMOKE_IMAGE: headplane-smoke:final
          SMOKE_PLATFORM: linux/${{ matrix.arch }}
        run: node .github/scripts/container-smoke.mjs
